<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2545"/>
      <stop offset="50%" stop-color="#134074"/>
      <stop offset="100%" stop-color="#031926"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bgGrad)"/>
  <!-- Subtly decorative tech rings -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.3"/>
  <circle cx="200" cy="180" r="160" fill="none" stroke="#2563eb" stroke-width="1" opacity="0.2"/>

  <!-- Corporate Executive Silhouette / Avatar -->
  <!-- Suit / Shoulders -->
  <path d="M90 380 C90 280 150 250 200 250 C250 250 310 280 310 380 Z" fill="url(#suitGrad)" stroke="#334155" stroke-width="2"/>
  <!-- White Shirt & Tie -->
  <polygon points="175,250 200,285 225,250" fill="#ffffff"/>
  <polygon points="195,275 205,275 208,340 200,355 192,340" fill="#2563eb"/>

  <!-- Neck & Face -->
  <rect x="185" y="215" width="30" height="40" rx="6" fill="#e2b995"/>
  <ellipse cx="200" cy="165" rx="52" ry="62" fill="#f0cbb0"/>
  <!-- Hair -->
  <path d="M145 155 C145 105 170 95 200 95 C235 95 255 110 255 155 C250 120 230 110 200 110 C165 110 150 135 145 155 Z" fill="#1e293b"/>
  <!-- Gentle smile / features -->
  <path d="M185 190 Q200 202 215 190" fill="none" stroke="#a3694d" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Founder Badge Plate -->
  <rect x="70" y="325" width="260" height="55" rx="10" fill="#031926" stroke="#38bdf8" stroke-width="1.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))"/>
  <text x="200" y="347" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">TINGIRIKAR TEJA</text>
  <text x="200" y="365" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">Founder &amp; Managing Director</text>
</svg>
