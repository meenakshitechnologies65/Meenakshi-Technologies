# ==============================================================================
# MEENAKSHI TECHNOLOGIES - PRODUCTION NGINX REVERSE PROXY & STATIC ASSET ENGINE
# High-performance caching, Gzip compression, HTTP/2 & Security Headers
# ==============================================================================

upstream meenakshi_backend {
    server backend:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost meenakshitechnologies.org www.meenakshitechnologies.org;

    # Maximum file upload size (for CMS PDF Brochures & Media Library)
    client_max_body_size 50M;

    # Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Healthcheck Endpoint for Container Orchestration
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Static Assets Caching - CSS & JS
    location ~* \.(?:css|js)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, must-revalidate";
        access_log off;
        try_files $uri @proxy_to_backend;
    }

    # Static Assets Caching - Images & Media
    location ~* \.(?:ico|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri @proxy_to_backend;
    }

    # PDF Catalogues & Datasheets
    location /catalogues/ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri @proxy_to_backend;
    }

    # Robots.txt & Sitemap.xml
    location = /robots.txt {
        root /usr/share/nginx/html;
        try_files $uri @proxy_to_backend;
    }

    location = /sitemap.xml {
        proxy_pass http://meenakshi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default Dynamic Routing to Node.js / Express Backend
    location / {
        proxy_pass http://meenakshi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Named fallback location to backend
    location @proxy_to_backend {
        proxy_pass http://meenakshi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
